<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SF Serve</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f8ff;
      color: #18243a;
    }
    header {
      background: #173b80;
      color: white;
      padding: 20px;
    }
    nav, main {
      max-width: 900px;
      margin: auto;
    }
    h1 { font-size: 38px; margin-bottom: 8px; }
    main { padding: 30px 18px; }
    .filters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin: 24px 0;
    }
    input, select {
      width: 100%;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
    }
    .card {
      background: white;
      padding: 22px;
      border-radius: 16px;
      margin-bottom: 15px;
      border: 1px solid #e2e8f0;
    }
    .tag {
      color: #2563eb;
      font-weight: bold;
    }
    .button {
      display: inline-block;
      background: #173b80;
      color: white;
      padding: 12px 18px;
      border-radius: 8px;
      text-decoration: none;
    }
    footer {
      padding: 24px;
      text-align: center;
      color: #64748b;
    }
  </style>
</head>
<body>
  <header>
    <nav><strong>SF SERVE 🤝</strong></nav>
  </header>

  <main>
    <h1>Find your next opportunity.</h1>
    <p>Discover volunteer opportunities for San Francisco teens.</p>

    <div class="filters">
      <input id="search" placeholder="Search opportunities...">

      <select id="age">
        <option value="14">I'm 14</option>
        <option value="15" selected>I'm 15</option>
        <option value="16">I'm 16</option>
        <option value="17">I'm 17</option>
        <option value="18">I'm 18+</option>
      </select>

      <select id="category">
        <option value="All">All interests</option>
        <option value="Healthcare">Healthcare</option>
        <option value="Education">Education</option>
        <option value="Community">Community</option>
      </select>
    </div>

    <h2>Explore opportunities</h2>
    <div id="results"></div>
  </main>

  <footer>Made for SF teens • SF Serve</footer>

  <script>
    // DEMO DATA ONLY. Replace with verified listings.
    const opportunities = [
  {
    name: "SF-Marin Food Bank — Pennsylvania Warehouse",
    category: "Community",
    age: 10,
    location: "Potrero Hill, San Francisco",
    description: "Pack grocery boxes and sort produce or donations. Minimum age is 10 on weekdays and 8 on Saturdays, but individual shifts may have different rules. Minors may need an accompanying adult.",
    url: "https://volunteering.sfmfoodbank.org/agency/detail/?agency_id=109763"
  },
  {
    name: "SF-Marin Food Bank — Illinois Warehouse",
    category: "Community",
    age: 11,
    location: "Dogpatch, San Francisco",
    description: "Help sort food and prepare groceries for neighbors. Listed minimum age is 11. Check each shift for supervision requirements and availability.",
    url: "https://www.sfmfoodbank.org/volunteer/"
  },
  {
    name: "SF-Marin Food Bank — Community Markets",
    category: "Community",
    age: 11,
    location: "Various San Francisco locations",
    description: "Help neighbors shop for groceries by stocking shelves, greeting visitors, and assisting with distribution. Ages 11+. Volunteers under 18 must be accompanied by an adult.",
    url: "https://www.sfmfoodbank.org/programs/community-markets/"
  },
  {
    name: "SF Public Library — FOG Readers Tutor",
    category: "Education",
    age: 15,
    location: "San Francisco Public Library branches",
    description: "Tutor a student in grades 1–4 using a structured reading curriculum. Select volunteers ages 15+ are eligible. Requires training, fingerprinting, and a six-month commitment.",
    url: "https://sfpl.org/locations/main-library/bridge-main-5th-floor/fog-readers/fog-readers-tutor"
  },
  {
    name: "SF Public Library — Teen-Led Programs",
    category: "Education",
    age: 15,
    location: "San Francisco Public Library",
    description: "Propose a workshop or activity for your community. Open to ages 15–18. Submit your idea at least four months ahead; the library reviews proposals before approval.",
    url: "https://sfpl.org/teens/volunteer-job-opportunities/teen-led-programs"
  },
  {
    name: "GLIDE — Community Volunteer",
    category: "Community",
    age: 9,
    location: "Tenderloin, San Francisco",
    description: "Help support GLIDE's community programs, including meal service. Youth ages 9+ are welcome. Everyone under 18 needs a parent- or guardian-signed minor waiver.",
    url: "https://www.glide.org/volunteer/"
  },
  {
    name: "Friends of Alemany Farm — Farm Volunteer",
    category: "Community",
    age: 0,
    location: "Alemany Farm, San Francisco",
    description: "Help grow food through planting, harvesting, composting, and other farm projects. All ages are welcome. Register before your first workday and check requirements for minors.",
    url: "https://alemanyfarm.org/get-involved/"
  },
  {
    name: "Visitacion Valley Greenway — Community Garden",
    category: "Community",
    age: 0,
    location: "Visitacion Valley, San Francisco",
    description: "Join community gardening workdays. All ages and skill levels are welcome. The official page lists Wednesday and Saturday volunteer hours; check before visiting.",
    url: "https://www.sfrecpark.org/Facilities/Facility/Details/Visitacion-Valley-Greenway-Agriculture-L-407"
  },
  {
    name: "SF Animal Care & Control — Parent/Teen Volunteer Team",
    category: "Community",
    age: 12,
    location: "San Francisco Animal Care & Control",
    description: "Volunteer with a parent or legal guardian in eligible animal-care positions. Ages 12–17 may join parent/child teams. Training and a one-year commitment are required.",
    url: "https://www.sfanimalcare.org/volunteer/"
  },
  {
    name: "Golden Gate National Parks — Habitat Restoration",
    category: "Community",
    age: 15,
    location: "Various San Francisco park sites",
    description: "Help remove invasive plants, restore native habitats, and care for park landscapes. Some events accept ages 15+. Check the specific event's minimum age, permission form, and available dates.",
    url: "https://www.parksconservancy.org/volunteer/habitat-restoration-volunteering"
  }
];

    const results = document.getElementById("results");

    function displayOpportunities() {
      const search = document.getElementById("search")
        .value.toLowerCase();
      const age = Number(document.getElementById("age").value);
      const category = document.getElementById("category").value;

      const matches = opportunities.filter(item => {
        return item.age <= age &&
          (category === "All" || item.category === category) &&
          (item.name + " " + item.description)
            .toLowerCase().includes(search);
      });

      results.replaceChildren();

      if (matches.length === 0) {
        results.textContent = "No matching opportunities found.";
        return;
      }

      matches.forEach(item => {
        const card = document.createElement("div");
        card.className = "card";

        const tag = document.createElement("p");
        tag.className = "tag";
        tag.textContent = item.category;

        const title = document.createElement("h3");
        title.textContent = item.name;

        const details = document.createElement("p");
        details.textContent =
          item.location + " • Minimum age: " + item.age;

        const description = document.createElement("p");
        description.textContent = item.description;

        card.append(tag, title, details, description);

        if (item.url) {
          const link = document.createElement("a");
          link.className = "button";
          link.href = item.url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = "Apply on official website";
          card.append(link);
        }

        results.append(card);
      });
    }

    document.getElementById("search")
      .addEventListener("input", displayOpportunities);

    document.getElementById("age")
      .addEventListener("change", displayOpportunities);

    document.getElementById("category")
      .addEventListener("change", displayOpportunities);

    displayOpportunities();
  </script>
</body>
</html>
