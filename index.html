    const results = document.getElementById("results");

    function displayOpportunities() {
      const search = document.getElementById("search")
        .value.toLowerCase();
      const age = Number(document.getElementById("age").value);
      const category = document.getElementById("category").value;

      const matches = opportunities.filter(item => {
        return item.age <= age &&
          (category === "All" || item.category === category) &&
          (item.name + " " + item.description)
            .toLowerCase().includes(search);
      });

      results.replaceChildren();

      if (matches.length === 0) {
        results.textContent = "No matching opportunities found.";
        return;
      }

      matches.forEach(item => {
        const card = document.createElement("div");
        card.className = "card";

        const tag = document.createElement("p");
        tag.className = "tag";
        tag.textContent = item.category;

        const title = document.createElement("h3");
        title.textContent = item.name;

        const details = document.createElement("p");
        details.textContent =
          item.location + " • Minimum age: " + item.age;

        const description = document.createElement("p");
        description.textContent = item.description;

        card.append(tag, title, details, description);

        if (item.url) {
          const link = document.createElement("a");
          link.className = "button";
          link.href = item.url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = "Apply on official website";
          card.append(link);
        }

        results.append(card);
      });
    }

    document.getElementById("search")
      .addEventListener("input", displayOpportunities);

    document.getElementById("age")
      .addEventListener("change", displayOpportunities);

    document.getElementById("category")
      .addEventListener("change", displayOpportunities);

    displayOpportunities();
